<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webchama is not responding</title>
<!--
  Served by nginx when the backend cannot be reached, so it is deliberately standalone: no
  bundle, no stylesheet, no font request. Anything it imported would be a second thing that can
  fail at exactly the moment this page exists to handle. The palette is therefore a copy of the
  tokens in frontend/src/index.css rather than a reference to them.
-->
<style>
  :root { --paper: #F7F0E4; --ink: #12302B; --muted: #6E7F79; --primary: #1B4D45; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0B211D; --ink: #EAF2EF; --muted: #9FB3AC; --primary: #8DBBB0; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem; padding: 2rem 1.5rem; text-align: center;
    background: var(--paper); color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  svg { width: 40px; height: 40px; color: var(--primary); }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 30rem; color: var(--muted); }
  button {
    margin-top: .5rem; padding: .7rem 1.6rem; border: none; border-radius: 999px;
    background: var(--primary); color: var(--paper);
    font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <rect x="3" y="3" width="26" height="26" rx="7"/>
    <path d="M10 20 L20 10" stroke-linecap="round"/>
  </svg>
  <h1>Webchama is not responding</h1>
  <p>
    The app is running but cannot reach its server, so nothing can be loaded or saved right now.
    This is usually brief. Nothing you had already saved is affected.
  </p>
  <button type="button" onclick="window.location.reload()">Try again</button>
</body>
</html>
