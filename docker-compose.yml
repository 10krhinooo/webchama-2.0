services:
  postgres:
    image: postgres:16-alpine
    container_name: webchama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chama
      POSTGRES_USER: chama
      POSTGRES_PASSWORD: chama
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chama -d chama"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: webchama-keycloak
    restart: unless-stopped
    # See keycloak/dev-realm-entrypoint.sh: always imports realm-chama.json (which is committed to
    # git, dev-only) but substitutes in CHAMA_SUPERADMIN_PASSWORD rather than using the committed
    # placeholder value (audit finding P0-2).
    entrypoint: ["/bin/sh", "/opt/keycloak/dev-realm-entrypoint.sh"]
    environment:
      KC_DB: dev-file
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      CHAMA_SUPERADMIN_PASSWORD: "${CHAMA_SUPERADMIN_PASSWORD:-}"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-chama.json:/opt/keycloak/config/realm-chama.json:ro
      - ./keycloak/dev-realm-entrypoint.sh:/opt/keycloak/dev-realm-entrypoint.sh:ro
      - ./keycloak/themes/chama:/opt/keycloak/themes/chama:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  keycloak_data:
