services:
  postgres:
    image: postgres:16-alpine
    container_name: webchama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chama
      POSTGRES_USER: chama
      POSTGRES_PASSWORD: chama
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chama -d chama"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: webchama-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_DB: dev-file
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-chama.json:/opt/keycloak/data/import/realm-chama.json:ro
      - ./keycloak/themes/chama:/opt/keycloak/themes/chama:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  keycloak_data:
