<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Webchama">
  <!--
    Two ticks, the second confirming the first: the maker-checker rule the product is built on,
    where no single treasurer moves money alone. Chosen over the other concepts because its whole
    meaning survives as two strokes, which is what a 16px favicon reduces it to.
    Source and alternatives: design/logos/.
  -->
  <rect width="64" height="64" rx="16" fill="#1B4D45"/>
  <path d="M14 33 L23 42 L39 22" fill="none" stroke="#F7F0E4" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 40 L34 47 L51 25" fill="none" stroke="#E0A233" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
