quarkus.application.name=webchama

# Datasource — matches docker-compose.yml's postgres service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=chama
quarkus.datasource.password=chama
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/chama

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Hibernate ORM — Flyway owns schema, Hibernate must never auto-generate DDL
quarkus.hibernate-orm.database.generation=none

# --- OIDC (Keycloak dev instance on port 8180, realm "chama") ---
quarkus.oidc.auth-server-url=http://localhost:8180/realms/chama
quarkus.oidc.client-id=webchama-backend
quarkus.oidc.credentials.secret=webchama-backend-secret
quarkus.oidc.token.issuer=http://localhost:8180/realms/chama
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.application-type=service
# Both settings are required together for public endpoints in OIDC service mode:
# - permit policy: tells the HTTP security layer not to require auth for these paths
# - proactive=false: stops the OIDC bearer mechanism from challenging before JAX-RS runs
quarkus.http.auth.proactive=false

%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/chama
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_URL}/realms/chama
%prod.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
