# Copy this file to application.properties before running the backend.
# cp src/main/resources/example.application.properties src/main/resources/application.properties
#
# application.properties is gitignored so real secrets added in later phases
# (M-Pesa, Flutterwave, mail, and so on) never get committed by accident.

quarkus.application.name=webchama

# Datasource, matches docker-compose.yml's postgres service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=chama
quarkus.datasource.password=chama
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/chama

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Hibernate ORM, Flyway owns schema, Hibernate must never auto-generate DDL
quarkus.hibernate-orm.database.generation=none

# --- OIDC (Keycloak dev instance on port 8180, realm "chama") ---
quarkus.oidc.auth-server-url=http://localhost:8180/realms/chama
quarkus.oidc.client-id=webchama-backend
quarkus.oidc.credentials.secret=webchama-backend-secret
quarkus.oidc.token.issuer=http://localhost:8180/realms/chama
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.application-type=service
# Both settings are required together for public endpoints in OIDC service mode:
# - permit policy: tells the HTTP security layer not to require auth for these paths
# - proactive=false: stops the OIDC bearer mechanism from challenging before JAX-RS runs
quarkus.http.auth.proactive=false

%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/chama
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_URL}/realms/chama
%prod.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}

# Keycloak Admin API, used to provision a member's account on invite (KeycloakAdminService)
keycloak.admin.url=http://localhost:8180
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.app.realm=chama

%prod.keycloak.admin.url=${KEYCLOAK_URL}
%prod.keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME}
%prod.keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}

# Mailer, sends the member invite credential email. Auto-mocked (logged, not
# actually sent) in dev and test profiles, real SMTP only kicks in via the
# %prod overrides below.
quarkus.mailer.from=Webchama <no-reply@webchama.app>

%prod.quarkus.mailer.host=${MAIL_HOST}
%prod.quarkus.mailer.port=${MAIL_PORT:587}
%prod.quarkus.mailer.username=${MAIL_USERNAME}
%prod.quarkus.mailer.password=${MAIL_PASSWORD}
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.from=${MAIL_FROM:Webchama <no-reply@webchama.app>}

# quarkus-jacoco: application classes are loaded through Quarkus's own
# runtime classloader during @QuarkusTest, which the jacoco-maven-plugin
# agent alone does not see. reuse-data-file makes Quarkus append coverage
# for those classes into the same jacoco.exec the Maven plugin reports on,
# instead of a separate file nothing reads.
%test.quarkus.jacoco.reuse-data-file=true
