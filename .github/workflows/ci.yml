name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Quarkus / Maven, 90 percent coverage gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Create application.properties from the example
        run: cp src/main/resources/example.application.properties src/main/resources/application.properties

      - name: Start Postgres and Keycloak (docker compose)
        run: docker compose up -d

      - name: Wait for Postgres to be ready
        # @QuarkusTest wipes every table in @BeforeEach, so it must never share a database with
        # anything else, %test.quarkus.datasource.jdbc.url points at chama_test for this reason.
        # chama_test itself is created by postgres-init/01-create-test-db.sql on container init.
        run: |
          for i in $(seq 1 30); do
            if docker exec webchama-postgres pg_isready -U chama -d chama_test > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Wait for Keycloak to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8180/realms/chama/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          docker compose logs
          exit 1

      - name: Build and test with coverage gate
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Stop docker compose
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (Vite / TypeScript, 90 percent coverage gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests with coverage gate
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: frontend/coverage/

      - name: Build
        run: npm run build
        working-directory: frontend

  # Proves the images DEPLOYMENT.md describes actually build from a fresh checkout, not just that
  # a Dockerfile is present (audit finding P1-10). Doesn't push anywhere, no registry is
  # configured for this repo; that's the next step once one exists.
  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t webchama-backend .

      - name: Build frontend image
        run: docker build -t webchama-frontend --build-arg VITE_KEYCLOAK_URL=https://auth.example.com frontend/

  # Drives the product the way it is actually deployed: real Keycloak login through a browser, the
  # SPA served by nginx rather than the Vite dev server, and the Quarkus backend behind it. The
  # payment providers are the only thing stubbed.
  e2e:
    name: End-to-end (Playwright, full stack)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Create application.properties from the example
        run: cp src/main/resources/example.application.properties src/main/resources/application.properties

      - name: Install dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start the stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      # globalSetup polls all three services itself and fails with an explicit instruction, but
      # waiting here first keeps a slow container start from being reported as a test failure.
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            backend=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/health || true)
            keycloak=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8181/realms/chama/.well-known/openid-configuration || true)
            spa=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5174/ || true)
            if [ "$backend" = "200" ] && [ "$keycloak" = "200" ] && [ "$spa" = "200" ]; then
              echo "stack ready"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become ready: backend=$backend keycloak=$keycloak spa=$spa"
          docker compose -f docker-compose.e2e.yml logs --tail=200
          exit 1

      - name: Run the end-to-end suite
        run: npm test
        working-directory: e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Upload traces and screenshots from failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=300

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
