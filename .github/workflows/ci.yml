name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Quarkus / Maven, 90 percent coverage gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Create application.properties from the example
        run: cp src/main/resources/example.application.properties src/main/resources/application.properties

      - name: Start Postgres and Keycloak (docker compose)
        run: docker compose up -d

      - name: Wait for Keycloak to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8180/realms/chama/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          docker compose logs
          exit 1

      - name: Build and test with coverage gate
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Stop docker compose
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (Vite / TypeScript, 90 percent coverage gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests with coverage gate
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: frontend/coverage/

      - name: Build
        run: npm run build
        working-directory: frontend
