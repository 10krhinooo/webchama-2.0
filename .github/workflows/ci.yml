name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Quarkus / Maven, 90 percent coverage gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Create application.properties from the example
        run: cp src/main/resources/example.application.properties src/main/resources/application.properties

      - name: Start Postgres and Keycloak (docker compose)
        # CHAMA_DEV_REALM_IMPORT opts in to importing keycloak/realm-chama.json, required here since
        # CI's own Postgres/Keycloak containers are as isolated a dev environment as it gets, but
        # never set this in a shared/production environment (see keycloak/dev-realm-entrypoint.sh).
        run: CHAMA_DEV_REALM_IMPORT=true docker compose up -d

      - name: Wait for Postgres to be ready
        # @QuarkusTest wipes every table in @BeforeEach, so it must never share a database with
        # anything else, %test.quarkus.datasource.jdbc.url points at chama_test for this reason.
        # chama_test itself is created by postgres-init/01-create-test-db.sql on container init.
        run: |
          for i in $(seq 1 30); do
            if docker exec webchama-postgres pg_isready -U chama -d chama_test > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Wait for Keycloak to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8180/realms/chama/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          docker compose logs
          exit 1

      - name: Build and test with coverage gate
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Stop docker compose
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (Vite / TypeScript, 90 percent coverage gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests with coverage gate
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: frontend/coverage/

      - name: Build
        run: npm run build
        working-directory: frontend

  # Proves the images DEPLOYMENT.md describes actually build from a fresh checkout, not just that
  # a Dockerfile is present (audit finding P1-10). Doesn't push anywhere, no registry is
  # configured for this repo; that's the next step once one exists.
  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t webchama-backend .

      - name: Build frontend image
        run: docker build -t webchama-frontend --build-arg VITE_KEYCLOAK_URL=https://auth.example.com frontend/
